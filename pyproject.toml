[project]
authors = [{name = "sanderengel", email = "saet@itu.dk"}]
dependencies = []
name = "splendor"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/splendor"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
splendor = { path = ".", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pixi.tasks]
lab = "jupyter lab"
test = "pytest"

# Common inputs
export-network = { cmd = "python scripts/common/export_network.py", depends-on = ["test"] }
clip-basemap = { cmd = "python scripts/common/clip_basemap.py", depends-on = ["export-network"] }

# Loop census
generate-loops = { cmd = "python scripts/loops/census/generate.py", depends-on = ["export-network"] }
validate-loops = { cmd = "python scripts/loops/census/validate.py", depends-on = ["generate-loops"] }

# Links
link-landuse = { cmd = "python scripts/links/compute_landuse.py", depends-on = ["clip-basemap"] }
link-components = { cmd = "python scripts/links/compute_components.py", depends-on = ["link-landuse"] }
link-score = { cmd = "python scripts/links/compute_score.py", depends-on = ["link-components"] }

# Loops
loop-landuse = { cmd = "python scripts/loops/compute_landuse.py", depends-on = ["validate-loops", "clip-basemap"] }

# Pipelines
links = { depends-on = ["link-score"] }
loops = { depends-on = ["loop-landuse"] }
full = { depends-on = ["links", "loops"] }

[tool.pixi.activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/src"

[tool.pixi.dependencies]
python = "3.12.*"
geopandas = ">=1.2.0,<2"
shapely = ">=2.2.0,<3"
pyogrio = ">=0.13.0,<0.14"
python-igraph = ">=1.0.0,<2"
networkx = ">=3.7,<4"
numpy = ">=2.5.4,<3"
scipy = ">=1.18.1,<2"
pandas = ">=3.1.0,<4"
matplotlib = ">=3.11.2,<4"
pyyaml = ">=6.0.3,<7"
jupyterlab = ">=4.6.4,<5"
ipykernel = ">=7.4.0,<8"
pytest = ">=9.1.1,<10"
pip = ">=26.2.2,<27"
rasterio = ">=1.5.2,<2"
